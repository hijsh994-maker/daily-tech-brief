# TIER 2 : Google News RSS 키워드 검색  <<< 실질적 backbone
#   롱테일 144개 매체(전기신문/디일렉/로봇신문/천지일보/KOB...)를
#   개별 등록하는 건 불가능. 키워드 쿼리로 통째로 흡수.
#   실제 쿼리 목록은 keywords.yaml -> discovery_queries 참조
# -------------------------------------------------------------
tier2_google_news:
  endpoint: "https://news.google.com/rss/search?q={QUERY}+when:{WINDOW}&hl=ko&gl=KR&ceid=KR:ko"
  window: 1d
  max_items_per_query: 100
  status: ok            # 2026-07-22 검증: '피지컬 AI' 100건, 롱테일 매체 정상 포착
  caveats:
    - "OR 연산자 신뢰도 낮음(6건만 반환) -> 키워드 1개당 1쿼리로 분리할 것"
    - "지역지/대학보도자료 노이즈 유입 -> keywords.yaml exclude 필수"
  en_endpoint: "https://news.google.com/rss/search?q={QUERY}+when:{WINDOW}&hl=en-US&gl=US&ceid=US:en"

