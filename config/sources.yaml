# -------------------------------------------------------------
# TIER 0 : 기존 트렌드 로그 저장소  <<< 최우선 수집 (이미 쌓이고 있음)
#
#   기 구축된 자동화가 매일 09:10/09:21 에 3개 출처를 한 파일에 append.
#   크롤링 대상이 아니라 "이미 정제된 입력"이므로 가장 먼저 읽는다.
#   -> 별도 Telethon 재실행 불필요. tier8 벤치마크 항목을 이걸로 대체.
# -------------------------------------------------------------
tier0_trend_log:
  repo: https://github.com/hijsh994-maker/slack-trend-backdata
  path: logs/{YYYY-MM-DD}.md
  raw: https://raw.githubusercontent.com/hijsh994-maker/slack-trend-backdata/main/logs/{YYYY-MM-DD}.md
  status: ok            # 2026-07-22 실측: 13,524 bytes
  auth: none            # Public repo. raw.githubusercontent 직접 GET
  note: "생성 시각 09:21 KST 이후에 읽을 것. 수집기 스케줄 07:00 과 충돌하므로 tier0만 09:30 별도 실행"

  subsections:

    - key: slack_3trend
      heading: "## 메시지"
      format: "- [HH:MM] AI Daily News: 하위에 마크다운 링크 목록"
      volume: "약 18건/일"
      value: high
      caveat: link_unusable      # 아래 link_resolution 참조
      note: "링크가 news.google.com/rss/articles/... 리다이렉트 URL. 직링크 아님"

    - key: samsung_global_ai_sw
      heading: "## 텔레그램 - 삼성 글로벌 AI/SW 뉴스"
      format: "■ 로 시작하는 단문 불릿"
      volume: "약 16건/일"
      value: high
      caveat: no_link            # 링크 자체가 없음
      coverage: "글로벌 편중. 코어위브·데이터브릭스·팔로알토·베센트 재무장관 등
                 우리 en_track 이 놓치는 영역을 보완"
      role: "커버리지 감사 + 글로벌 리드. 6/10 실장님이 비교 지적하신 그 소스"

    - key: adot_biz_newsletter
      heading: "## 텔레그램 - 에이닷비즈뉴스레터"
      format: "토픽별 섹션 > '제목' 개행 'ㄴ매체 YYYY.MM.DD [관련뉴스 N건]'"
      volume: "5토픽 x 10건 = 약 50건/일"
      value: highest             # 3개 중 최고
      caveat: no_link
      topics: [AI모델동향, AI에이전트, 데이터센터시장, 로봇동향, AI기술현황]
      note: |
        가장 값이 큰 소스.
        (1) 제목/매체/날짜가 구조화되어 있어 파싱이 결정론적.
        (2) "관련뉴스 N건" 표기가 곧 클러스터 크기.
            keywords.yaml 의 impact_signals.cluster_bonus 를 우리가 계산할
            필요 없이 그대로 가져다 쓸 수 있음.
        (3) 토픽 5종이 우리 카테고리와 거의 1:1 대응 -> 분류 사전검증에 활용.
        (4) 국내 매체 커버리지가 넓음. 쿠키뉴스/경향신문/세계일보/서울경제TV 등
            tier1 미등록 매체 다수 -> tier1 확장 후보 자동 발굴에도 사용.

  usage:
    - "discovery 소스가 아니라 cross-check 소스로 쓴다"
    - "우리 파이프라인 수집분과 diff -> '우리만 놓친 건' 리포트 자동 생성"
    - "반대로 '로그에 없고 우리만 잡은 건'은 신규 발굴 성과로 집계"

# -------------------------------------------------------------
# LINK RESOLUTION  <<< 7/20 사고의 원인이자 파이프라인 필수 단계
#
#  [실측 2026-07-22]
#   Google News RSS 의 <link> 는 news.google.com/rss/articles/CBMi... 형태이며
#     - Base64 디코딩 -> 원문 URL 안 나옴 (불투명 토큰만 나옴)
#     - HTTP 리다이렉트 추적 -> 200 반환, 최종 URL 그대로 (JS 리다이렉트)
#   즉 프로그램적으로 직링크를 얻을 수 없음.
#   <source url> 은 발행사 "도메인"만 제공 (예: https://www.seoul.co.kr)
#
#  [영향] 7/20 실장님 피드백 "기사가 덜 올라온거 같습니다 / 한참 걸리네요;; /
#         뜨긴 뜹니다" 가 정확히 이 증상. 구글뉴스 리다이렉트 페이지를
#         브리프에 그대로 실으면 재발함.
#
#  [규칙] 브리프에 news.google.com URL 을 절대 싣지 않는다. 반드시 치환.
#
#  [해결 경로 - 순서대로 시도]
#   1. tier1/tier3 매체 RSS 에서 제목 매칭 -> 직링크 확보
#      ** tier1 매체 RSS 의 진짜 가치는 '발견'이 아니라 '링크 확보'다 **
#      Google News 가 무엇이 있는지 알려주고, 매체 RSS 가 링크를 채운다.
#   2. 네이버 뉴스 검색 API (국내 기사, 직링크 반환)
#   3. <source url> 도메인 + 제목으로 사이트 내 검색
#   4. 위 전부 실패 시 -> 브리프에서 제외 (링크 없는 기사는 싣지 않음)
#
#  [검증] 발송 직전 전 링크 HTTP 200 + 본문 길이 > 400자 확인.
#         길이 미달이면 7/20 처럼 "짧게만 뜨는" 상태이므로 교체 또는 제외.
# -------------------------------------------------------------
link_resolution:
  forbid_domains: [news.google.com]
  order: [local_index_title_match, naver_news_api, site_search, drop]
  verify:
    http_status: 200
    min_body_chars: 400

  # === 프로토타입 실측 결과 (2026-07-22, 에이닷 50건 대상) ===
  #
  #  1차 시도(온디맨드 RSS 조회) 해결률 6.0%  <- 실패
  #    해결 3건 / 피드없음 18건(36%) / 매칭실패 29건(58%)
  #
  #  [원인] 매칭 알고리즘 문제가 아니라 RSS 창(window) 깊이 문제.
  #    - 해결된 3건은 전부 당일(07-22) 기사
  #    - 매칭실패 29건 중 22건이 07-20~07-21 기사
  #    - 최근접 후보가 전혀 무관한 기사 = 피드에 아예 없음
  #    - RSS 는 최신 N건만 제공하고 N이 매체별로 천차만별:
  #        서울신문 25 · 전자신문 30 · 경향신문 50 · 서울경제 100
  #        아시아경제 100 · 조선비즈 100 · 이투데이 215 · 헤럴드경제 300
  #      전자신문은 하루 수백 건 발행하므로 30건이면 1~2시간치에 불과.
  #
  #  [매칭기 자체는 정상] 기사가 피드에 있으면 정확히 잡음:
  #    score 1.000  "유아이디, 글로벌탑넷과 AI 데이터센터 신소재 개발 협력…"
  #                 -> https://view.asiae.co.kr/article/2026072208314683513
  #    score 0.786  제목이 축약된 변형도 매칭 성공
  #    정규화(말머리/기호/공백 제거) + SequenceMatcher 0.75 임계값 유지.
  #
  #  [결론 - 아키텍처 변경]
  #    온디맨드 조회(로그 읽는 시점에 RSS 호출)는 구조적으로 불가능.
  #    RSS 를 상시 적재(continuous ingest)로 바꾸고, 링크 해결은
  #    그 로컬 인덱스를 조회하는 방식이어야 한다.
  #    -> link_resolution 은 독립 단계가 아니라 상시 수집의 부산물이 된다.
  #    -> collect.py 를 30~60분 주기로 돌려 index/articles.sqlite 에 누적.
  #       (url, outlet, title, norm_title, published, first_seen)
  #       보존 14일. dedup 롤링 윈도우와 동일 저장소 공유.
  #
  #  === 경로 2(네이버 뉴스 검색 API) 투입 후 (2026-07-22 18:23) ===
  #
  #    6.0%  ->  96.0%   (인덱스 3 + 네이버 45 / 50건)
  #      07-20  1/ 1 (100%)
  #      07-21 30/32 ( 94%)   <- RSS 창으로는 0% 였던 구간
  #      07-22 17/17 (100%)
  #
  #  [핵심] 네이버는 과거 기사도 색인하므로 RSS 창 깊이 문제가 사라진다.
  #         no_feed 매체(뉴스1 등)도 originallink 로 직링크 확보됨.
  #         예: https://www.news1.kr/it-science/internet-platform/6233944
  #
  #  [구현 시 걸린 문제 2가지 - naver_api.py 참조]
  #   1. 스마트 따옴표(“”‘’)가 질의에 있으면 검색 결과 0건.
  #      -> sanitize_query() 로 제거. 전체제목 -> 정제 -> 앞부분 순으로 재시도.
  #   2. 에이닷 뉴스레터가 제목을 고쳐 쓰는 경우가 있음.
  #        로그 '나스닥 1.3%↑, 3거래일 만에 반등...반도체주 AI 랠리 주도'
  #        실제 '나스닥 1.3% 상승…마이크론 12% 급등, 반도체주 AI 랠리 주도'
  #      -> 발행사 도메인이 일치하면 임계값 0.55 로 완화, 아니면 0.75 유지.
  #      -> 오탐 검증 결과 완화 적용은 45건 중 1건뿐이고 정답이었음.
  #         점수 분포: 1.00 24건 / 0.90+ 16건 / 0.75+ 4건 / 0.55~0.75 1건
  #
  #  [잔여 2건 - 경로 3 대상]
  #    파이낸셜뉴스 "삼성, 대표직속 로봇조직 신설..." (네이버에 해당 기사 없음)
  #    전자신문 "누가 제일 잘 싸울까? 세계 최초 휴머노이드 로봇 격투대회"
  #    -> 4%. 경로 3(사이트 내 검색) 투자 대비 효과 낮음. 당분간 drop 처리.
  #
  #  [주의] 네이버 뉴스 검색은 news.naver.com 제휴 매체만 색인한다.
  #         해외 매체(TechCrunch/Reuters/KOB 등)는 경로 1(tier3 RSS)이 담당.

  naver_api:
    status: ok
    endpoint: "https://openapi.naver.com/v1/search/news.json"
    auth: "환경변수 NAVER_CLIENT_ID / NAVER_CLIENT_SECRET (파일 저장 금지)"
    quota: "25,000 콜/일 무료. 실사용 하루 수백 콜"
    use_field: originallink   # link 는 news.naver.com 주소라 사용 금지

  ingest:
    mode: continuous
    interval_min: 45
    index: index/articles.sqlite
    retention_days: 14
  match:
    normalize: [strip_bracket_prefix, strip_symbols, strip_spaces, lower]
    algorithm: SequenceMatcher
    threshold: 0.75

