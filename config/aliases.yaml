# aliases.yaml — 국문/영문·표기 흔들림을 하나로 묶는 별칭표  [2026-09-21 신설]
#
# 왜 만들었나
#   09-18 발송본에 Figure 공식 게시물 "Helix 2.5: Zero-Shot 30-Home
#   Generalization" 이 실렸는데, 09-21 후보 "피규어 AI, 로봇 모델
#   '헬릭스 2.5' 공개" 와 제목 토큰이 **한 개도 겹치지 않아**
#   run.sh hist 가 '처음 나온 이야기' 로 찍었고 중복 발송이 났다.
#   주체·제품 이름의 국문 표기와 영문 표기를 기계가 같은 것으로
#   보게 하려고 만든다.
#
# 쓰는 법
#   cowork/repeat_gate.py 가 헤드라인을 정규화할 때 왼쪽 표기를
#   전부 오른쪽 대표어로 바꾼 뒤 토큰을 비교한다.
#   **긴 표기를 먼저 적는다**(부분 치환이 먼저 먹지 않게).
#
# 갱신
#   중복을 놓친 사례가 나오면 그 쌍을 여기에 한 줄 추가한다.
# =============================================================
