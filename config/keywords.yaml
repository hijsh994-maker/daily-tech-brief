    #
    # 왜 tier1 로는 못 잡나:
    #   이데일리 전체 피드(edaily_news.xml)는 50건 하드캡인데 발행량이 많아
    #   50건 = 43분치뿐이다(08-05 실측: 09:41~10:11 30분). collect 는 하루
    #   한 번이라 나머지 23시간은 구조적으로 못 본다. depth 를 올려도 서버가
    #   50건만 준다. 섹션 피드로 우회하려 했으나 AI 기사가 실리는 IT·과학
    #   섹션은 RSS 자체가 없다(tech/it/science/digital/... 전부 404).
    #   enterprise_news.xml(23.1h)은 커버는 넓지만 위 두 건이 안 들어온다.
    #   세계일보·파이낸셜뉴스·디지털데일리는 sources.yaml 에서 not_found.
    #
    # 실측(2026-08-05, when:2d):
    #   "이데일리 인공지능"   -> 위 이데일리 2건 모두 적중
    #   "세계일보 인공지능"   -> 세계일보 1건 적중
    #   "디지털데일리 인공지능" -> 퓨리오사 RNGD 건 적중
    #   'site:edaily.co.kr AI' 형태는 100건 캡에 걸려 오히려 놓친다.
    #   매체명을 그대로 쓰는 자연어 쿼리가 재현율이 높다.
    - "이데일리 인공지능"
    - "이데일리 AI"
    - "세계일보 인공지능"
    - "파이낸셜뉴스 인공지능"
    - "디지털데일리 인공지능"

  en_track:            # 영문 (12)
    # 사각지대 57건 중 13건이 영문 원문. 단 본 백테스트는 한국어 번역본
    # 대상이라 영문 쿼리 성능은 측정 불가 -> 실수집 1주 후 재평가 필요.
    - "AI data center"
    - "physical AI"
    - "sovereign AI"
    - "frontier model"
    - "AI agent"
    - "AI agent security"    # [추가 09-04] 상한 분산(AI agent 95건).
                             #  09-03 'Stop Rogue AI Act' 계열
    - "inference cost"
    - "AI funding round"
    - "AI acquisition"
    - "AI startup acquisition"  # [추가 09-04] 상한 분산(AI acquisition 99건,
                                #  전체 최고 포화)
    # [삭제 09-04] "LLM vulnerability" - 09-04 실측 5건.
    #   국문 "AI 보안 위협" 으로 흡수한다(영문 결과는 en_track 다른 쿼리가 커버).
    - "AI export control"
    - "humanoid robot"
    - "humanoid robot funding"  # [추가 09-04] 상한 분산(humanoid robot 94건)
    - "digital twin"
    # --- 확장 (2026-07-31). 채점을 고쳐도 남은 미달의 대부분이 '채점 낮음'이
    # 아니라 '아예 수집 안 됨'이었다(Disney·CoreWeave·Kill Switch Act·Palantir·
    # Banks·AMD-Anthropic·OpenAI EU HQ). 공통점은 영문 엔터프라이즈 도입/이탈,
    # 미국 AI 입법, 기업 금융 딜 — 기존 12개 쿼리가 안 건드리던 영역이다.
    # [주의] tier2 는 프리즌(당일치만)이라 이 확장은 소급 검증이 불가하다.
    #        내일 실행분부터 compare 로 효과를 확인할 것.
    - "enterprise AI adoption"
