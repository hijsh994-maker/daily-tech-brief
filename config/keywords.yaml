    - "Nvidia AI"
    # [삭제 10-22 사용자 결정] - "Nvidia GPU supply"    # [추가 09-04] 상한 분산(Nvidia AI 94건)   <- 섀도 실험(10-08~10-22) '고' 0건·발송 0건
