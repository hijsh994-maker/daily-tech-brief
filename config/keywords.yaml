# (4) 카테고리 배정 키워드
#     현행 브리프(7/22 기준) 섹션 구조 그대로
# -------------------------------------------------------------
# [튜닝 이력]
#  - 7/22 실측: '기타' 42% -> 키워드 보강으로 9.5%
#  - 7/20 실측: 동점 시 AI Model(첫째)이 무조건 이겨 투자·정책 기사가 샘.
#    -> 목록을 '우선순위 순'으로 재배열. categorize() 가 동점이면 앞선 것을 택한다.
#    -> 성격이 뚜렷한 카테고리(독파모/자사디바이스/정책/보안/투자)를 앞에,
#       넓고 흔한 주제 카테고리(AI Model)를 뒤에 둔다.
#  변별력 있는 어휘를 넣되 지나치게 흔한 말(예: 'AI')은 넣지 않는다.
categories:
  # --- 우선순위 높음: 성격이 뚜렷해 오분류하면 안 되는 것들 ---
  # 2026-08-12 사용자 지시: '독파모(소버린AI)' -> '독파모 & 모두의 AI & 특파모'.
  # **2026-09-04 사용자 지시로 개정: '독파모 & 모두의 AI' 로 축소.**
  #   SKT 가 특파모(사이버보안 특화 AI 파운데이션 모델) 경쟁에서 탈락했다.
  #   원문: '우리회사가 특파모 경쟁에서 탈락했거든. 따라서 앞으로 특파모
  #          관련 기사는 후보에서 제외해주고, 카테고리명도 독파모 & 모두의 AI
  #          로 수정해줘.'
  #   -> 카테고리명에서 '& 특파모' 를 떼고, 특파모 전용 키워드도 전부 제거한다.
  #      기사 자체를 후보에서 빼는 것은 relevance.must_none 과
  #      editor_rubric 의 D축 배제 목록이 담당한다(둘 다 09-04 에 추가).
  #     독파모   = 독자 AI 파운데이션 모델
  #     모두의 AI = 모두의 AI 프로젝트
  #   **만료일을 두지 않는다.** 사용자가 다시 지시할 때까지 유지한다.
  # **[2026-09-09 임원 피드백] 카테고리 해체.**
  #   원문: '카테고리가 너무 세분화 되어 있다. 통합 가능한 것은 통합해라
  #          (독파모는 AI Model, 모두의 AI는 AI Agent에 통합 등 해야 할듯)'
  #   -> '독파모 & 모두의 AI' 를 없애고 키워드를 둘로 나눠 보냈다.
  #      독파모(독자 파운데이션 모델·소버린) = AI Model 로
  #      모두의 AI(전국민 AI 서비스)        = AI Agent 로
  #   **주제 자체의 중요도는 그대로다.** 카테고리는 브리프 배치 기준일 뿐이고,
  #   판정·순위 가중치는 rankscore.py 의 W축(소버린·독파모/모두의AI +3)이
  #   따로 들고 있다. 여기서 해체해도 선별에서 밀리지 않는다.
  #   **이름이 아래 'AI Model' 블록과 같은 것은 의도한 것이다.** categorize()
  #   는 name 으로 배정하고 동점이면 앞선 블록을 택하므로, 독파모 어휘를
  #   목록 맨 앞에 두면 정책·투자 어휘가 섞인 기사에서도 AI Model 로 간다.
  #   (종전 '독파모 & 모두의 AI' 가 1순위였던 이유와 같다.)
  - name: "AI Model"          # 독파모·소버린 블록 (우선순위 1)
    keywords: [독파모, 독자 AI 파운데이션, 독자 파운데이션, 소버린 AI, 주권형,
               엑사원, 하이퍼클로바, 모티프, 솔라 오픈, 믿음, AI 주권,
