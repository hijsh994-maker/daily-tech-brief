  #   판단이 '독립 근거'로 다시 채점되는 자기참조를 줄이기 위해 절반으로 낮춤.
  #
  #   A/B 실측(truth 보유 3일: 07-23 / 07-28 / 07-30, min-score=6):
  #     기존 5:5/4:4/3:2  임계통과 57% / 67% / 50%, 160위내 6 / 8 / 6건
  #     반감 5:3/4:2/3:1  임계통과 57% / 67% / 50%, 160위내 6 / 8 / 6건  <- 동일
