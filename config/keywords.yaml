# -------------------------------------------------------------
# (1-b) PEOPLE - 인물 처리
#
#  [측정 결과] 브리프 421건 중 인물 언급 36건.
#              그중 30건(83%)이 소속 기업명을 함께 포함.
#              인물명으로만 잡히는 기사는 6건이고, 그중 3건은 동일 기사
#              (G7 정상회의) -> 실질 고유 4건 = 전체의 약 1%.
#
#  [결론] 인물을 discovery 쿼리로 돌리는 것은 비효율.
#         기업 엔티티 쿼리가 이미 83%를 흡수함.
#         원래 기획서의 "인플루언서 18명 (매체에서 이름 검색)" 방식은
#         쿼리 18개를 쓰고 1%를 얻는 구조였음.
#
#  [대안] 인물은 3개 역할로 분리 처리한다.
# -------------------------------------------------------------
people:

  # (a) 대부분은 기업 쿼리로 자동 수집됨 - 별도 쿼리 불필요
  #     최태원 5건 -> 5건 모두 'SK' 동반
  #     손정의 3건 -> 3건 모두 '소프트뱅크' 동반
  #     정의선/피차이/나델라/곽노정 -> 100% 기업명 동반

  # (b) IMPACT 가중치용 사전 (수집된 기사 대상 +1점)
  #     "누가 말했는가"가 기사 중요도를 좌우하므로 스코어링에 반영
  vip_boost:
    글로벌: [젠슨 황, 샘 올트먼, 일론 머스크, 다리오 아모데이, 순다 피차이,
             사티아 나델라, 데미스 하사비스, 마크 저커버그, 손정의, 리사 수]
    # 영문 표기 (2026-07-31 추가). 국문 이름만 있어 영문 원문은 VIP 가점을
    # 한 번도 못 받았다. 07-30 'Mark Zuckerberg predicts...'가 5점으로
    # 임계 1점 아래에 걸린 것이 대표 사례.
    글로벌_en: ['(?i)\bJensen Huang\b', '(?i)\bSam Altman\b', '(?i)\bElon Musk\b',
                '(?i)\bDario Amodei\b', '(?i)\bSundar Pichai\b', '(?i)\bSatya Nadella\b',
                '(?i)\bDemis Hassabis\b', '(?i)\bZuckerberg\b', '(?i)\bMasayoshi Son\b',
                '(?i)\bLisa Su\b']
    국내:   [최태원, 이재용, 정의선, 구광모, 유영상, 최수연, 정신아,
             곽노정, 김영섭, 홍범식, 유경상]
    # [2026-09-03] 유경상(SKT AI CIC장) 추가. 09-03 정답지 「인물」 에 실렸는데
    #   vip_boost 명단에 없어 VIP+1 조차 못 받았다.
    정책:   [트럼프, 이재명, 배경훈]
    정책_en: ['(?i)\bTrump\b']

  # [2026-09-03 사용자 지시] 지정 인물 조건부 가점 명단.
  #   이 둘의 발언·인터뷰는 **내용이 AI 관련일 때** 등급을 한 단계 올린다.
  #   **이름만으로 올리지 않는다.** 최태원은 SK그룹 수장이라 출산·청년·
  #   일반 반도체 경기 이야기가 많고, 그런 주제면 '고'로 보지 않는다.
  #   AI 맥락의 반도체(AI DC용 메모리·HBM·AI칩 조달·공급망)는 가점 대상이다.
  #   판정 규칙 전문은 cowork/editor_rubric.py 의 8-1 항에 있다.
  #   (여기 명단은 프롬프트에 실어 주기 위한 것이고, 기계 채점은 하지 않는다.
  #    AI 관련 여부 판단이 키워드로 갈리지 않기 때문이다.)
  person_boost_conditional: [최태원, 유경상]

  # (c) 인물 단독 이벤트용 최소 쿼리 (3개만)
  #     방한/회동/정상회의처럼 기업명 없이 인물만 뜨는 케이스 대응.
  #     18명 -> 3개로 축소. 나머지는 (a),(b)가 커버.
  event_queries:
    # [삭제 09-04] "빅테크 CEO 방한" - 09-04 실측 1건, 20일간 정답지 기여 0건.
    #   방한 기사는 ko_entity 의 기업명 쿼리가 이미 흡수한다(위 측정 83%).
    - "AI 정상회의"
    - "AI CEO 회동"

  # [운영 주의] 표기 변형 실측 (2026-07-22, Google News)
  #   - 띄어쓰기는 무관: "젠슨 황"(100건) == "젠슨황"(100건), 결과 동일.
  #     Google News가 한국어를 토크나이즈하므로 공백 변형 관리 불필요.
  #   - 음역 변형은 결과가 다름: "샘 올트먼"(64건) vs "샘 알트만"(12건).
  #     연합뉴스=올트먼 / 뉴스1=알트만. 두 표기 모두 필요.
  transliteration_variants:
    샘 올트먼: [샘 알트만, Sam Altman]
    다리오 아모데이: [아모데이, Dario Amodei]
    젠슨 황: [Jensen Huang]
    일론 머스크: [머스크, Elon Musk]

  # [노이즈] 인물 쿼리는 연성 기사 유입률이 높음. 실측 사례:
  #   "젠슨황 가죽 재킷, 14억원에 낙찰" (연합뉴스TV)
  #   -> event_queries 결과에는 아래 필터를 반드시 적용
  noise_filter:
    - 가죽 재킷
    - 낙찰
    - 경매
    - 패션
    - 자택
    - 재산
    - 어록
    - 사생활
    - 결혼
    - 친분

# -------------------------------------------------------------
# (2) RELEVANCE - 수집 후 필터
#     tier1 RSS 는 매체 전체를 긁으므로 (연예/스포츠/증시 포함)
#     이 필터가 없으면 하루 수천 건이 그대로 밀려들어옵니다.
# -------------------------------------------------------------
relevance:

  # 하나라도 있어야 통과 (must_any)
  must_any:
    - AI
    - 인공지능
    - LLM
    - 파운데이션 모델
    - 에이전트
    - 데이터센터
    - GPU
    - NPU
    - HBM
    - 반도체
    - 로봇
    - 휴머노이드
    - 자율주행
    - 클라우드
    - 머신러닝
    - 딥러닝

  # 있으면 즉시 탈락 (must_none) - 실측 노이즈 기반
  #
  # [적용 범위] 원시 소스(tier1 RSS / tier2 구글뉴스)와 AI 큐레이션 소스
  # (에이닷·슬랙)에만 적용한다. 사람이 고른 삼성 소스는 면제.
  #
  # 아래 지자체·행사·증시 항목은 2026-07-20 에이닷 50건에서 실제로 나온 것들이다.
  # AI 가 자동 선별하다 보니 'AI' 라는 단어만 들어가면 끌어온다:
  #   경북도 AI 정책 경진대회 / 조지훈 전주시장 인터뷰 / 서울시복지재단 생성형 AI
  #   카카오 펫레터 만들기 이벤트 / [알립니다] 스마트클라우드쇼 개최
  must_none:
    - 특강            # "한국게임과학고, 피지컬 AI 특강" 류
    - 인재 양성 사업
    - 공모전
    - 경진대회
    - 수상
    - 채용 설명회
    - 부고
    - 인사이동
    - 오늘의 운세
    - 알립니다        # 자사 행사 홍보
    - 이벤트 진행
    - 복지시설
    - 사회복지
    # --- 증시 시황. AI 기사처럼 보이지만 브리프 대상이 아니다 ---
    - 특징주
    - 굿모닝 증시
    - 뉴욕마감
    - 뉴욕인사이트
    - 하락 출발
    - 상승 출발
    - 목표가
    - 주식 급등
    - 상한가
    - 테마주
    - 관련주
    - 코인 시세
    - 리뷰 이벤트
    - 할인 행사
    # --- [2026-09-04 사용자 지시] 특파모 사업 배제 ---
    #   SKT 가 사이버보안 특화 AI 파운데이션 모델(특파모) 경쟁에서 탈락했다.
    #   '앞으로 특파모 관련 기사는 후보에서 제외'.
    #
    #   [설계 원칙] '보안 특화 **AI**' 처럼 AI/모델이 붙은 형태만 넣는다.
    #   '보안 특화 모델' 처럼 AI 를 뺀 형태는 넣지 않는다. 구글·오픈AI 의
    #   보안 특화 모델 출시 기사가 같이 죽기 때문이다.
    #
    #   [실측 검증 2026-09-04] 그날 후보 전량(tier0+tier2)에 걸어 본 결과
    #     특파모 사업 기사 39건 중 35건 차단(90%)
    #     구글·오픈AI 등 해외 벤더 보안모델 기사 17건 **전부 생존**
    #   차단 못 한 4건('보안 특화 모델' 사업 내준 SKT 등)은 AI 없이
    #   '보안 특화 모델' 만 쓴 제목이라 의도적으로 남겼다.
    #   must_none 은 tier0 사람큐레이션(삼성·NewsClips)에 면제이기도 하므로,
    #   빠져나간 건은 판정 단계(D축 배제 8항목)가 잡는다.
    - 특파모
    - K-미토스
    - K미토스
    - 보안 특화 AI
    - 보안특화 AI
    - 보안 특화 AI모델
    - 보안특화 AI모델
    - 사이버보안 AI 모델
    - 사이버 보안 AI 모델
    - 보안 AI모델
    - 보안 환경 특화
    - 보안 특화 모델 사업
    - 보안 특화 AI 개발
    - 보안 특화 AI 파운데이션
    - 보안특화 파운데이션
    - 사이버보안 특화 파운데이션
    - 보안 특화 인공지능
    - 국가 보안 특화
