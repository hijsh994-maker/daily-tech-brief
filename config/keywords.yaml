# (4-b) ENTITY ALIASES - 교차언어 클러스터링용 엔티티 정규화
#
#  같은 사건이 국문/영문으로 따로 수집되면 엔티티 이름이 달라(앤스로픽↔Anthropic,
#  미스트랄↔Mistral) 클러스터가 안 묶인다. 각 그룹의 표면형을 하나의 canonical
#  토큰(그룹 첫 항목)으로 매핑해, refine 이 클러스터링 토큰·후보색인에 주입한다.
#
#  [매칭 방식] 제목을 소문자·공백/하이픈 제거한 문자열에 표면형이 부분문자열로
#  들어있는지 본다. 그래서 오탐 위험이 있는 표면형은 넣지 않는다:
#    - intel(=intelligence), aws(=laws/flaws), ms, arm, 라마(=드라마), 인텔(=인텔리전트)
#    - humanoid 는 로봇 유형 일반어라 제외(고유명사 'Humanoid' 스타트업과 충돌)
#  [안전장치] 교차언어 병합은 엔티티를 2개 이상 공유할 때만 허용한다(refine).
#  표면형 하나가 오탐돼도 단독으로는 병합을 일으키지 못한다.
