# =============================================================
# Daily Tech Brief - 키워드 레지스트리 (초안 v0.1)
# 근거: 브리프 421건 제목+본문 토큰 빈도 분석 (2026-06-10~07-22)
#
# 키워드는 역할이 3가지이고, 서로 다른 목록이 필요합니다.
#   (1) discovery : 매체 목록에 없는 기사를 "찾아오는" 검색 쿼리
#   (2) relevance : 수집한 전량에서 "남길지 버릴지" 판단하는 필터
#   (3) impact    : 남긴 것들의 "순위를 매기는" 가중치
# =============================================================

# -------------------------------------------------------------
# (0) POLICY - 수집 전반에 적용되는 전역 정책
# -------------------------------------------------------------
policy:
  # [2026-10-22 사용자 결정] 후보 입력에서 뺄 소스. rss = tier1 매체 RSS(index/articles.sqlite).
  #   섀도 실험(10-08~10-22, 20일): RSS·구글 쿼리 9개를 뺀 후보에서 발송본 307건 중 사라진 것 1건(10-15 Modal 7.5억달러), 입력 -10%.
  #   사용자: "RSS·쿼리 9개 작업에서 빼자". refine.py 가 읽는다. 쿼리 9개는 discovery_queries 에서 주석 처리했다(# [삭제 10-22]).
  #   collect.py 의 RSS 적재는 계속한다(buzz 반응 감지·링크 확보용). 되살리려면 아래 줄을 지운다.
  exclude_sources: [rss]
  # 발간일 창: 브리프는 '실행 전일 ~ 당일' 기사만 유효.
  # 이 범위를 벗어난 기사는 후보로도 올라오지 않게 각 수집 단계에서 제외한다.
  #   window_days: 1  ->  [실행일-1, 실행일]
  # 발간일을 알 수 없는 기사(pub_date 없음)의 처리는 allow_undated 로 결정.
  date_window_days: 1
  # [2026-08-18 사용자 지시] 휴일 보정. 계산은 datewin.py 가 한다.
  #   트리거: 실행일의 **전날이 한국 공휴일이거나 일요일**이면 창을 늘린다.
  #   크기  : 직전 영업일까지 거슬러 올라간다(주말도 건너뛴다). 최소 3일.
  #             window = max(3, (실행일 - 직전영업일).days)
  #     평일 월요일(전날 일요일)        -> 3  [금, 토, 일, 월]
  #     주중 공휴일 하루 뒤             -> 3
  #     연휴가 주말에 붙은 뒤(08-18)    -> 4
  #     설·추석 연휴 뒤                 -> 6
  #   근거: 08-18(화) 검증. 08-14(금) 발송이 없었고 08-15 광복절·08-16 일·
  #   08-17 대체공휴일로 나흘이 비었는데 창이 1일이라 정답지 17건 중 5건이
  #   후보에조차 못 올라왔다. 새 규칙은 창을 4일로 잡아 5건 전부 들어온다.
  #   3일 '고정'이 아니라 '최소'인 이유: 고정이면 08-15 까지만 닿아
  #   08-14 발행분 3건을 여전히 놓친다.
  #
  # [2026-08-03 -> 2026-08-18 삭제] 종전의 요일 기반 보정(월요일=3일)은
  #   없앴다. 기준을 요일이 아니라 '전날에 쉬었는가'로 옮긴 것이고,
  #   일요일 트리거가 그 자리를 대신한다(평일 월요일은 여전히 3일).
  #   아래 키를 되살려도 datewin.py 는 읽지 않는다.
  # date_window_days_by_weekday:
  #   0: 3
  # 발간일 미상 기사 허용 여부.
  #   tier0(사람/AI 큐레이션): 당일 뉴스레터이므로 미상이어도 신뢰 -> 허용
  #   tier1/tier2(원시 수집): 미상이면 제외(오래된 기사 혼입 방지)
  allow_undated_trusted: true
  allow_undated_raw: false

  # 언어 정책: 같은 사건이 한글/영문으로 중복 수집될 때 한글 매체를 대표로.
  # 영문 원문 기사는 후보에서 제외한다(브리프 독자는 국내 조직).
  # 단, 국내에 기사가 전혀 없는 글로벌 이슈는 영문이라도 남긴다(cross-check용).
  prefer_korean: true
  drop_english_when_korean_exists: true

# -------------------------------------------------------------
# (1) DISCOVERY - Google News RSS 검색 쿼리  [v0.2]
#
#  백테스트 (과거 브리프 421건 대상, 2026-07-22 실측):
#    v0.1 61쿼리 -> 80.0%
#    v0.2 62쿼리 -> 91.0%   (쿼리 수는 그대로, 구성만 교체)
#
#  v0.1 대비 변경점:
#   - 시그널 쿼리 15개 전량 삭제. "AI 투자 유치"/"AI 인수"/"AI 감원" 등
#     복합구문은 실측 0건. 기사는 "Baseten, 15억달러 투자 유치"라고 쓰지
#     "AI 투자 유치"라고 쓰지 않음. -> impact_signals 로 이동시킴.
#   - 엔티티 17 -> 27개 확대 (그룹 한계기여 -152건으로 최대)
#   - 좁은 쿼리를 광역 쿼리로 병합 ("AI 모델" 33건 > 좁은 3개 합계 8건)
#   - 인물 쿼리 제거 -> people 섹션에서 별도 처리 (사유는 해당 섹션 참조)
#   - 사용자 지목 6개 추가로 +4.8%p (86.2 -> 91.0%)
#
#  주의: Google News OR 연산자 신뢰도 낮음 -> 1키워드 1쿼리 유지
#  일일 부하: 62쿼리 x 최대 100건 = 원시 6,200건 (dedup 후 400~600건 예상)
# -------------------------------------------------------------
discovery_queries:

  ko_topic:            # 광역 토픽 - 그룹 한계기여 -74건
    # =========================================================
    # [2026-09-04 개정] 쿼리를 '늘린' 것이 아니라 '쪼갠' 것이다.
    #
    #   구글뉴스 RSS 는 쿼리당 약 100건에서 잘린다. 09-04 실측:
    #   97개 쿼리 중 12개가 90건 이상으로 상한에 붙어 있었다
    #   (AI acquisition 99 / OpenAI 96 / AI 데이터센터 95 / LG 95 /
    #    AI agent 95 / Nvidia AI 94 / humanoid robot 94 / 카카오 93 /
    #    네이버 92 / SK텔레콤 90 / AI 모델 90 / AI 보안 90).
    #
    #   최근 20일 '수집실패' 14건을 대조해 보니 9건이 **쿼리는 이미
    #   있는데 결과가 잘려서** 못 받은 건이었다:
    #     '구글의 21조원 인도 AI 데이터센터' -> `구글`·`AI 데이터센터` 둘 다 존재
    #     '엔비디아 베라 루빈 원가 62% 메모리' -> `엔비디아` 존재
    #     'MS의 AI 계획, 반도체 부족' -> `마이크로소프트` 존재
    #     'AI 반도체의 90%가 메모리' -> `AI 반도체` 존재
    #   즉 커버리지 문제가 아니라 **결과 수 상한** 문제다.
    #
    #   그래서 넓은 쿼리는 지우지 않고 두되, 옆에 **좁은 쿼리**를 붙여
    #   다른 결과 묶음을 받아 온다. 좁은 쿼리는 상한에 안 닿으므로
    #   광역 쿼리에서 잘려 나간 뒷부분을 주워 온다.
    #
    #   [주의] 이 개정으로 tier2 후보가 늘어난다. 전수 판정 물량이
    #   같이 늘면 refine 의 --max-items 300 을 조정할 것.
    # =========================================================
    - "AI 데이터센터"
    - "AI 데이터센터 전력"   # [추가 09-04] 상한 분산. 전력계약·요금·입지
    - "AI 데이터센터 투자"   # [추가 09-04] 상한 분산. 조달·자금·계약
    - "데이터센터"           # [추가] 매칭 59건/신규 7건. 최대 성과.
                             #  DC 인허가·환경·침수 이슈를 여기서 잡음
                             #  (뉴멕시코 가스관, 뉴욕주 건설금지 등)
    - "데이터센터 규제"      # [추가 09-04] 美 주(州) 건설금지·주민반대 계열.
                             #  09-04 정답 후보 '센트럴파크 2배 DC 백지화'
    - "AIDC"
    - "피지컬 AI"
    - "휴머노이드"
    - "로봇"                 # [추가] 매칭 46건/신규 4건
    # [삭제 10-22 사용자 결정] - "로보택시"   <- 섀도 실험(10-08~10-22) '고' 0건·발송 0건
    - "자율주행"
    - "디지털트윈"           # [추가] 매칭 4건/신규 1건
    # [삭제 09-04] "스마트글래스" - 09-04 실측 3건. 20일간 정답지 기여 0건이고
    #   D축 핵심 어젠다 밖이다. 자리를 상한 분산 쿼리에 넘긴다.
    - "소버린 AI"
    - "AI 에이전트"
