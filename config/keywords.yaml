    - 억 달러
    - 조원
    - 수주
    - 장기 계약
    - 지급보증
    # --- 영문 대응어 (2026-07-31 추가) ---
    # [왜] 신호 어휘가 국문 전용이라 영문 원문은 구조적으로 2~5점에 갇혔다.
    # 사람 브리프는 절반이 영문인데, 영문 기사가 받을 수 있는 점수는
    # 프런티어+2·수치규모·보도수·교차소스뿐이었다(단일 보도면 사실상 2~3점).
    # 국문 목록과 같은 뜻의 영문만 넣는다. hit() 는 (?i) 가 있으면 정규식으로
    # 다루므로 대소문자 무시 + 단어경계로 오탐을 막는다.
    - (?i)\bacquir(?:e|es|ed|ing)\b
    - (?i)\bacquisition\b
    - (?i)\bmerger\b
    - (?i)\braise[sd]?\s+\$
    - (?i)\bfunding round\b
    - (?i)\bseries [A-E]\b
    - (?i)\bvaluation\b
    - (?i)\binvest(?:s|ed|ing|ment)?\b
    - (?i)\bstake\b
    - (?i)\bseals?\s+.{0,12}deals?\b

  medium_weight:    # +2
    - 출시
    - 공개
    - 발표
    - MOU
    - 업무협약
    - 파트너십
