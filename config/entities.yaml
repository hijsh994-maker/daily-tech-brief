# -------------------------------------------------------------
# SKT 투자·협력사
#   [2026-09-01 사용자 지시] 편집자 루브릭 A축에서 `SKT투자사` 는 2.0 으로
#   **주체 등급 최상위**인데, 정작 어느 회사가 거기 해당하는지 명단이
#   없어서 판정에 한 번도 쓰이지 못했다. 그래서 규모만 보고 '국내 중소'로
#   깎는 일이 생긴다.
#     실측 09-01: '코난테크놀로지, 영풍전자와 제조·방산 온톨로지 기반 AI
#     에이전트 개발'(tier0, 3점)을 '중소기업이라 저'로 판정해 뺐는데
#     정답지였다. 사용자 코멘트: "코난이 우리 회사에서 투자한 회사이기
#     때문에 단순 중소기업이 아니라 중요성이 올라간다."
#
#   **여기 있으면 규모와 무관하게 A축 최상위(SKT투자사)로 본다.**
#   명단에 없다고 내려 잡지는 않는다(이 파일 전체의 원칙과 같다).
#   새로 알게 되면 여기에 추가한다.
# -------------------------------------------------------------
