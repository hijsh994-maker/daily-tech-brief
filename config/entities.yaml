# =============================================================
# entities.yaml - 주체 등급을 회사 규모가 아니라 '역할'로 매기기 위한 명단
#
# 왜 만들었나 (2026-08-27 사용자 지시)
#   08-26 정답지 대조에서 내가 두 건을 '무명/소형'으로 깎아 뺐는데
#   편집자는 실었다.
#     - 모티프테크놀로지스: "독파모에 참여했던 기업이라 스타트업이지만
#       경쟁사 수준으로 높게 봤다"
#     - Figure AI: "로봇 개발사 중에 핵심 개발사"
#   즉 주체 등급은 회사 크기가 아니라 **무슨 역할을 하는 회사인가**로
#   정해야 한다. 그 판단이 내 기억에 기대면 날마다 흔들리므로 명단으로 둔다.
#
# 쓰는 법
#   refine 이 후보에 `국가사업참여`·`유명스타트업` 신호를 붙이고,
#   brief.py 가 프롬프트의 [주체 등급] 블록에 이 명단을 실어 준다.
#   **명단에 없다고 '무명'으로 확정하지 말 것.** 명단은 올려 잡는 근거이지
#   내려 잡는 근거가 아니다.
#
# 갱신
#   사업 선정 결과가 나오면 govt_projects 를 고친다(공모 -> 선정).
#   startups 는 분기에 한 번쯤 검색해 확인한다. 조사일을 함께 적을 것.
# =============================================================

meta:
  built: 2026-08-27
  method: "웹 검색으로 확인. 근거 URL 은 각 항목 note 참조"

